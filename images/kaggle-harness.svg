<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <rect width="1480" height="560" fill="#fafaf8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c5ce0"/>
    </marker>
  </defs>

  <!-- flow arrows -->
  <g stroke="#7c5ce0" stroke-width="5">
    <line x1="283" y1="195" x2="323" y2="195" marker-end="url(#arrow)"/>
    <line x1="574" y1="195" x2="614" y2="195" marker-end="url(#arrow)"/>
    <line x1="865" y1="195" x2="905" y2="195" marker-end="url(#arrow)"/>
    <line x1="1156" y1="195" x2="1196" y2="195" marker-end="url(#arrow)"/>
  </g>

  <!-- boxes -->
  <g>
    <rect x="40" y="90" width="235" height="210" rx="18" fill="#ffffff" stroke="#e5e2dc" stroke-width="2"/>
    <rect x="40" y="90" width="235" height="10" rx="5" fill="#7c5ce0"/>
    <text x="157" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#2b2b33">Muse</text>
    <text x="157" y="207" text-anchor="middle" font-size="20" fill="#6b6b76">パーソナルAI</text>
    <text x="157" y="239" text-anchor="middle" font-size="20" fill="#6b6b76">VM上で全体を統括</text>
  </g>
  <g>
    <rect x="331" y="90" width="235" height="210" rx="18" fill="#ffffff" stroke="#e5e2dc" stroke-width="2"/>
    <rect x="331" y="90" width="235" height="10" rx="5" fill="#7c5ce0"/>
    <text x="448" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#2b2b33">OpenCode</text>
    <text x="448" y="207" text-anchor="middle" font-size="20" fill="#6b6b76">コーディングワーカー</text>
    <text x="448" y="239" text-anchor="middle" font-size="20" fill="#6b6b76">DeepSeek / GLM</text>
  </g>
  <g>
    <rect x="622" y="90" width="235" height="210" rx="18" fill="#ffffff" stroke="#e5e2dc" stroke-width="2"/>
    <rect x="622" y="90" width="235" height="10" rx="5" fill="#7c5ce0"/>
    <text x="739" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#2b2b33">実験台帳</text>
    <text x="739" y="207" text-anchor="middle" font-size="20" fill="#6b6b76">仮説と進め方を</text>
    <text x="739" y="239" text-anchor="middle" font-size="20" fill="#6b6b76">事前に登録して管理</text>
  </g>
  <g>
    <rect x="913" y="90" width="235" height="210" rx="18" fill="#ffffff" stroke="#e5e2dc" stroke-width="2"/>
    <rect x="913" y="90" width="235" height="10" rx="5" fill="#7c5ce0"/>
    <text x="1030" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#2b2b33">ローカル検証</text>
    <text x="1030" y="207" text-anchor="middle" font-size="20" fill="#6b6b76">コストと正しさを</text>
    <text x="1030" y="239" text-anchor="middle" font-size="20" fill="#6b6b76">厳密に測定</text>
  </g>
  <g>
    <rect x="1204" y="90" width="235" height="210" rx="18" fill="#ffffff" stroke="#e5e2dc" stroke-width="2"/>
    <rect x="1204" y="90" width="235" height="10" rx="5" fill="#7c5ce0"/>
    <text x="1321" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#2b2b33">Kaggle</text>
    <text x="1321" y="207" text-anchor="middle" font-size="20" fill="#6b6b76">検証を通った回路を</text>
    <text x="1321" y="239" text-anchor="middle" font-size="20" fill="#6b6b76">提出</text>
  </g>

  <!-- loop-back -->
  <path d="M1321,314 L1321,378 L157,378 L157,314" fill="none" stroke="#7c5ce0" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="545" y="356" width="390" height="44" fill="#fafaf8"/>
  <text x="740" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#7c5ce0">4時間ごとに自律改善ループ</text>
</svg>
